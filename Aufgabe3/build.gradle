plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.allopen' version '2.2.21'
}

application {
    mainClass = 'aufgabe3.Aufgabe3ApplicationKt'
}

springBoot {
    mainClass = 'aufgabe3.Aufgabe3ApplicationKt'
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.addAll(
            '-Xjsr305=strict',
            '-Xannotation-default-target=param-property'
        )
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.hibernate.orm:hibernate-core'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

def frontendDir = file('frontend')
def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstallFrontend', Exec) {
    group = 'build'
    description = 'Installiert npm-Abhängigkeiten des React-Frontends'
    workingDir = frontendDir
    commandLine npmCmd, 'ci'
    inputs.files("$frontendDir/package.json", "$frontendDir/package-lock.json")
    outputs.dir("$frontendDir/node_modules")
}

tasks.register('buildFrontend', Exec) {
    group = 'build'
    description = 'Baut das React-Frontend nach src/main/resources/static'
    dependsOn 'npmInstallFrontend'
    workingDir = frontendDir
    commandLine npmCmd, 'run', 'build'
    inputs.dir("$frontendDir/src")
    inputs.files(
        "$frontendDir/index.html",
        "$frontendDir/package.json",
        "$frontendDir/vite.config.ts",
        "$frontendDir/tsconfig.json",
        "$frontendDir/tsconfig.app.json",
    )
    outputs.dir('src/main/resources/static')
}