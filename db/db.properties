# Verbindungsparameter für die Media-Store-Datenbank.
# Wird zur Laufzeit eingelesen, damit keine Logindaten im Quellcode stehen
# (datenbankunabhängig, vgl. Anforderung Teil 3). Werte passend zu db/docker-compose.yaml.
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/mediastore
db.user=user
db.password=password
db.impl=aufgabe3.hibernate.HibernateMediaStore
